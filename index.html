<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>KONG_PRAP PIXEL CHAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Press Start 2P', cursive; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { padding: 15px; text-align: center; border-bottom: 3px solid #0f0; background: #111; color: #0f0; font-size: 14px; }
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex-grow: 1; }
        #chat-screen { display: none; flex-direction: column; flex-grow: 1; padding: 15px; }
        #messages { flex-grow: 1; overflow-y: auto; border: 2px solid #0f0; padding: 10px; background: #050505; margin-bottom: 10px; font-size: 11px; line-height: 1.5; }
        .controls { display: flex; gap: 10px; }
        input { background: #000; border: 2px solid #0f0; color: #0f0; padding: 10px; font-family: 'Press Start 2P'; font-size: 12px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-family: 'Press Start 2P'; cursor: pointer; font-size: 12px; }
        button:hover { background: #fff; }
        .msg-line { margin-bottom: 8px; word-wrap: break-word; }
        .user { color: #ff00ff; }
    </style>
</head>
<body>
    <div id="header">>> KONG_PRAP_SYSTEM_ONLINE <<</div>
    <div id="login-screen">
        <p style="margin-bottom: 20px;">ENTER YOUR ID...</p>
        <input type="text" id="username" placeholder="NAME" autocomplete="off">
        <br>
        <button onclick="enterWorld()">ACCESS</button>
    </div>
    <div id="chat-screen">
        <div id="messages"></div>
        <div class="controls">
            <input type="text" id="msgInput" placeholder="TYPE MSG..." style="flex-grow: 1;" onkeypress="if(event.key==='Enter')send()">
            <button onclick="send()">SEND</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gfhogiztboefcuujnutp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_CMNs8PcOuM9YV7Uv8kPdKQ_P2M46anQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "Guest"; 

        async function enterWorld() {
            const nameInput = document.getElementById('username');
            if(nameInput.value.trim()) {
                myName = nameInput.value.trim();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                loadHistory();
                
                supabaseClient.channel('chat-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (payload.new) displayMessage(payload.new);
                })
                .subscribe();
            }
        }

        async function send() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if(msg) {
                input.value = ""; // ล้างช่องพิมพ์ทันทีกันเบิ้ล
                const { error } = await supabaseClient
                    .from('messages')
                    .insert([{ username: myName, content: msg }]);
                if(error) console.error("Error:", error.message);
            }
        }

        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true })
                .limit(50);
            
            const box = document.getElementById('messages');
            box.innerHTML = '<div>*** SYSTEM: SECURE CONNECTION ***</div><br>';
            if(data) {
                data.forEach(msg => displayMessage(msg));
            }
        }

        function displayMessage(msg) {
            const box = document.getElementById('messages');
            
            // ดักทุกทาง: ถ้า username ไม่มี ให้ลองหา Name หรือ user_id
            const user = msg.username || msg.Name || msg.user || "Unknown User";
            
            // ดักทุกทาง: ถ้า content ไม่มี ให้ลองหา Message หรือ text
            const text = msg.content || msg.Message || msg.text || "...";
            
            box.innerHTML += `<div class="msg-line"><span class="user">[${user}]:</span> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
